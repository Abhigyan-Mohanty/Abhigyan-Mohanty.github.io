<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almost Organic - Abhigyan Mohanty</title>
    <meta name="description" content="Almost Organic: nucleating particles in 2D and 3D, live in the browser">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .demo { margin: var(--space-lg) 0 var(--space-md); }
        .demo canvas { display: block; width: 100%; max-width: 640px; aspect-ratio: 1; margin: 0 auto; border-radius: 8px; touch-action: none; }
        #n3-canvas { cursor: grab; }
        .demo-controls { display: flex; flex-wrap: wrap; gap: var(--space-sm) var(--space-md); align-items: center; margin: var(--space-md) 0 var(--space-sm); font-size: 0.9rem; color: var(--text-secondary); }
        .demo-controls label { display: inline-flex; align-items: center; gap: var(--space-xs); white-space: nowrap; }
        .demo-controls input[type=range] { width: 110px; accent-color: var(--accent-color); }
        .demo-controls output { font-variant-numeric: tabular-nums; color: var(--text-primary); min-width: 3.5em; }
        .demo button { font: inherit; font-size: 0.9rem; padding: 3px 12px; border: 1px solid var(--accent-color); border-radius: 4px; background: transparent; color: var(--text-primary); cursor: pointer; }
        .demo button:hover { background: var(--hover-bg); }
        .demo button.on { background: var(--accent-color); color: #fff; }
        .demo-info { font-size: 0.85rem; color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: center; margin-top: var(--space-sm); }
        .demo-note { font-size: 0.85rem; color: var(--text-muted); }
    </style>
</head>

<body>
    <div class="container animate-in">
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="experiments.html" class="active">Experiments</a>
                <a href="art.html">Art</a>
                <a href="cycling.html">Cycling</a>
            </nav>
            <h1>Almost Organic</h1>
        </header>

        <main>
            <section id="nucleation-2d">
                <h2>2D nucleation</h2>
                <div class="demo">
                    <canvas id="nuc-canvas" aria-label="2D nucleation simulation"></canvas>
                    <div id="nuc-info" class="demo-info"></div>
                    <div class="demo-controls">
                        <button id="nuc-run">Pause</button> <button id="nuc-reset">Reset</button>
                        <label>steps/frame <input id="nuc-speed" type="range" min="1" max="30" value="3"> <output id="nuc-speed-v"></output></label>
                        <label>particles <input id="nuc-n" type="range" min="500" max="15000" step="500" value="2500"> <output id="nuc-n-v"></output></label>
                        <label>box <input id="nuc-l" type="range" min="80" max="300" step="10" value="160"> <output id="nuc-l-v"></output></label>
                        <span class="demo-note">(particles, box and anchor apply on Reset)</span>
                    </div>
                    <div class="demo-controls">
                        <label>mass ceiling <input id="nuc-cap" type="range" min="10" max="500" step="5" value="40"> <output id="nuc-cap-v"></output></label>
                        <label>eject rate <input id="nuc-erate" type="range" min="-4" max="0" step="0.1" value="-1.3"> <output id="nuc-erate-v"></output></label>
                        <label>ejecta <input id="nuc-efrac" type="range" min="1" max="99" value="25"> <output id="nuc-efrac-v"></output></label>
                        <label>eject speed <input id="nuc-v0" type="range" min="0.05" max="1" step="0.05" value="0.5"> <output id="nuc-v0-v"></output></label>
                    </div>
                    <div class="demo-controls">
                        <button id="nuc-crule"></button>
                        <label>colours <input id="nuc-ncol" type="range" min="2" max="8" value="3"> <output id="nuc-ncol-v"></output></label>
                        <label>rate = k at <input id="nuc-dref" type="range" min="1" max="100" value="20"> <output id="nuc-dref-v"></output></label>
                        <button id="nuc-hl"></button> <button id="nuc-win"></button> <button id="nuc-anchor"></button>
                    </div>
                </div>
            </section>

            <section id="nucleation-3d">
                <h2>3D nucleation</h2>
                <div class="demo">
                    <canvas id="n3-canvas" aria-label="3D nucleation simulation"></canvas>
                    <div id="n3-info" class="demo-info"></div>
                    <div class="demo-controls">
                        <button id="n3-run">Pause</button> <button id="n3-reset">Reset</button>
                        <label>steps/frame <input id="n3-speed" type="range" min="1" max="20" value="2"> <output id="n3-speed-v"></output></label>
                        <label>particles <input id="n3-n" type="range" min="500" max="20000" step="500" value="4000"> <output id="n3-n-v"></output></label>
                        <label>box <input id="n3-l" type="range" min="20" max="100" step="2" value="60"> <output id="n3-l-v"></output></label>
                        <span class="demo-note">(particles, box and anchor apply on Reset; drag to rotate, scroll to zoom, double-click to reset the view)</span>
                    </div>
                    <div class="demo-controls">
                        <label>mass ceiling <input id="n3-cap" type="range" min="10" max="500" step="5" value="40"> <output id="n3-cap-v"></output></label>
                        <label>eject rate <input id="n3-erate" type="range" min="-4" max="0" step="0.1" value="-1.3"> <output id="n3-erate-v"></output></label>
                        <label>ejecta <input id="n3-efrac" type="range" min="1" max="99" value="25"> <output id="n3-efrac-v"></output></label>
                        <label>eject speed <input id="n3-v0" type="range" min="0.05" max="1" step="0.05" value="0.5"> <output id="n3-v0-v"></output></label>
                    </div>
                    <div class="demo-controls">
                        <button id="n3-crule"></button>
                        <label>colours <input id="n3-ncol" type="range" min="2" max="8" value="3"> <output id="n3-ncol-v"></output></label>
                        <label>rate = k at <input id="n3-dref" type="range" min="1" max="100" value="15"> <output id="n3-dref-v"></output></label>
                        <button id="n3-hl"></button> <button id="n3-win"></button> <button id="n3-anchor"></button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; <span id="year"></span> Abhigyan Mohanty.</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script src="assets/experiments/almost_organic/nucleation2d.js"></script>
    <script src="assets/experiments/almost_organic/nucleation3d.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
