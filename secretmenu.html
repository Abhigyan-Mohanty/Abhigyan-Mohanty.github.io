<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Menu - Statistics</title>
    <meta name="description" content="Secret Menu - Statistics for Abhigyan Mohanty's website">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Chart.js for statistics graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .secret-content {
            display: none;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: var(--hover-bg);
            border-radius: 8px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-color);
            color: var(--text-primary);
        }

        .login-box button {
            padding: 10px 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        #statsChart {
            margin-top: 2rem;
            max-width: 100%;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: var(--hover-bg);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            margin-top: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
        }
    </style>
</head>

<body>
    <div class="container animate-in">
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="art.html">Art</a>
                <a href="cycling.html">Cycling</a>
            </nav>
            <h1>🔒 Secret Menu</h1>
        </header>

        <main>
            <!-- Password prompt -->
            <div id="login-section" class="login-box">
                <h2>Enter Password</h2>
                <input type="password" id="password" placeholder="Password">
                <button onclick="checkPassword()">Enter</button>
                <p id="error-msg" style="color: red; margin-top: 10px; display: none;">Invalid password.</p>
            </div>

            <!-- Secret stats content -->
            <div id="secret-content" class="secret-content">
                <div class="stat-grid">
                    <div class="stat-card">
                        <h3>Total Visits</h3>
                        <div class="value" id="total-visits">--</div>
                    </div>
                    <div class="stat-card">
                        <h3>Unique Visitors</h3>
                        <div class="value" id="unique-visitors">--</div>
                    </div>
                    <div class="stat-card">
                        <h3>Avg. Sessions/Day</h3>
                        <div class="value" id="avg-sessions">--</div>
                    </div>
                </div>

                <h2>Visits Over Time</h2>
                <canvas id="statsChart"></canvas>
            </div>
        </main>

        <footer>
            <p>&copy; <span id="year"></span> Abhigyan Mohanty.</p>
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const SECRET_PASSWORD = "820@Spidey";

        function checkPassword() {
            const pwd = document.getElementById('password').value;
            if (pwd === SECRET_PASSWORD) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('secret-content').style.display = 'block';
                loadStats();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // Allow 'Enter' key to submit
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        async function loadStats() {
            console.log("Loading statistics from localStorage...");
            const visits = JSON.parse(localStorage.getItem('website_visits') || '[]');

            // 1. Update Stat Cards
            document.getElementById('total-visits').textContent = visits.length;

            const uniquePages = new Set(visits.map(v => v.page)).size;
            document.getElementById('unique-visitors').textContent = uniquePages; // Showing unique pages as a proxy for "visitors" in this simple local setup

            const daysActive = new Set(visits.map(v => v.timestamp.split('T')[0])).size || 1;
            document.getElementById('avg-sessions').textContent = (visits.length / daysActive).toFixed(1);

            // 2. Prepare Chart Data (Visits per day for the last 7 days)
            const last7Days = [];
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                last7Days.push(date.toISOString().split('T')[0]);
            }

            const dailyVisits = last7Days.map(day => {
                return visits.filter(v => v.timestamp.startsWith(day)).length;
            });

            // 3. Initialize Chart
            const ctx = document.getElementById('statsChart').getContext('2d');
            const data = {
                labels: last7Days.map(d => d.slice(5)), // MM-DD format
                datasets: [{
                    label: 'Daily Visits',
                    data: dailyVisits,
                    borderColor: 'rgb(0, 82, 204)',
                    backgroundColor: 'rgba(0, 82, 204, 0.1)',
                    tension: 0.3,
                    fill: true
                }]
            };

            const config = {
                type: 'line',
                data: data,
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--border-color')
                            },
                            ticks: {
                                stepSize: 1,
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted')
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted')
                            }
                        }
                    }
                }
            };

            new Chart(ctx, config);
        }
    </script>
</body>

</html>
